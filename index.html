<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#1b1c1e" />
<link rel="icon" href="data:," />
<link rel="manifest" href="manifest.webmanifest" />
<title>Warranty Void</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="splash" aria-hidden="true"><div class="st"><b>WARRANTY VOID</b><small>Void where prohibited</small></div><div class="bvg"><span>With Big Viking Games</span><img src="/brand/bvg_logo_bone.png" alt="Big Viking Games" width="64"></div></div>
<canvas id="game"></canvas>
<img id="bvgmark" src="/brand/bvg_logo_bone.png" alt="" aria-hidden="true" draggable="false" width="60">
<div id="hud">
  <div id="topleft">
    <div class="bar hp"><div id="hpfill"></div><span id="hptxt"></span></div>
    <div class="bar heat"><div id="heatfill"></div><span id="heattxt">HEAT</span></div>
    <div id="meta"><span id="lvl"></span> <span id="timer"></span> <span id="carry"></span></div>
  </div>
  <div id="topright">
    <button id="btn-inv" class="chip-btn" title="Live inventory (I)">Pack</button>
    <button id="btn-stim" class="chip-btn" title="Stim (H)">Stim <b id="stimn">0</b></button>
    <button id="btn-town" class="chip-btn" title="Return to town (T)">Town</button>
    <button id="btn-menu" class="chip-btn" title="Menu">☰</button>
  </div>
  <div id="support" style="display:none"></div>
  <div id="toasts"></div>
  <div id="objective" style="display:none"><b></b><span></span></div>
  <canvas id="minimap" width="160" height="100" style="display:none"></canvas>
  <div id="banner"></div>
  <div id="channelbar" style="display:none"><div></div><span></span></div>
  <div id="dialog" style="display:none"></div>
  <div id="livepanel" style="display:none"></div>
  <div id="downpanel" style="display:none"></div>
  <div id="joyfixed"></div>
  <div id="joy"><div id="joyknob"></div></div>
  <div id="controls">
    <button id="interact" style="display:none">Interact <small>F</small></button>
    <div id="abilities">
      <button class="abtn empty" data-idx="0"><img class="aicon" alt="" draggable="false"><i class="cdsweep"></i><span class="heatpips"></span><span class="mark"></span><span class="akey">Q</span><span class="aname"></span></button>
      <button class="abtn empty" data-idx="1"><img class="aicon" alt="" draggable="false"><i class="cdsweep"></i><span class="heatpips"></span><span class="mark"></span><span class="akey">E</span><span class="aname"></span></button>
      <button class="abtn empty" data-idx="2"><img class="aicon" alt="" draggable="false"><i class="cdsweep"></i><span class="heatpips"></span><span class="mark"></span><span class="akey">R</span><span class="aname"></span></button>
    </div>
    <button id="dodge" class="atype-mobility"><img class="aicon" src="abilities/dodge.webp" alt="" draggable="false"><i class="cdsweep"></i><span class="akey">Space</span><span class="aname">Dodge</span></button>
    <div id="abtip" style="display:none"></div>
  </div>
  <div id="hint"></div>
</div>
<div id="modal" style="display:none"></div>
<div id="rotate"><div>Rotate your device to landscape</div></div>
<script type="module" src="/src/main.ts"></script>
<script>window.addEventListener('load',function(){if(/[?&]splash=hold/.test(location.search))return;setTimeout(function(){var e=document.getElementById('splash');if(!e)return;e.classList.add('out');setTimeout(function(){e.remove()},700)},1800)});</script>
</body>
</html>
